<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>PayDays — Оплата</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, 'Segoe UI', Arial, sans-serif;
            background: #0a0a0a;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 16px;
            margin: 0;
        }

        body.tg-theme {
            background: var(--tg-theme-bg-color, #0a0a0a);
            color: var(--tg-theme-text-color, #ffffff);
        }

        .card {
            max-width: 420px;
            width: 100%;
            background: rgba(10, 10, 10, 0.92);
            padding: 28px 22px;
            border-radius: 24px;
            border: 1px solid rgba(200, 0, 0, 0.2);
            box-shadow: 0 8px 40px rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(10px);
            animation: fadeUp 0.5s ease-out;
        }

        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 14px;
            border-bottom: 1px solid rgba(200, 0, 0, 0.12);
        }

        h2 {
            font-size: 22px;
            font-weight: 700;
            color: #fff;
        }

        h2 span { color: #ff3333; }

        .type-badge {
            padding: 5px 14px;
            border-radius: 50px;
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            background: rgba(200, 0, 0, 0.2);
            border: 1px solid rgba(200, 0, 0, 0.25);
            color: #ff6666;
        }

        .type-badge.working {
            background: rgba(255, 255, 255, 0.08);
            border-color: rgba(255, 255, 255, 0.15);
            color: #ffffff;
        }

        .address-box {
            background: rgba(0, 0, 0, 0.5);
            padding: 14px;
            border-radius: 14px;
            border: 1px solid rgba(200, 0, 0, 0.1);
            margin: 16px 0;
        }

        .address-label {
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            color: rgba(255, 255, 255, 0.25);
            margin-bottom: 4px;
        }

        .address {
            font-family: 'Courier New', monospace;
            font-size: 14px;
            color: #fff;
            word-break: break-all;
        }

        .address .highlight { color: #ff4444; }

        .form-group {
            margin: 18px 0;
        }

        label {
            display: block;
            color: rgba(255, 255, 255, 0.6);
            font-weight: 600;
            font-size: 13px;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 6px;
        }

        .input-wrapper {
            position: relative;
        }

        .input-wrapper::before {
            content: '$';
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: rgba(255, 255, 255, 0.2);
            font-size: 20px;
            font-weight: 700;
        }

        input {
            width: 100%;
            padding: 14px 14px 14px 38px;
            border-radius: 14px;
            border: 1px solid rgba(200, 0, 0, 0.15);
            background: rgba(0, 0, 0, 0.5);
            color: #fff;
            font-size: 20px;
            font-weight: 600;
            transition: all 0.3s;
            outline: none;
            -webkit-appearance: none;
        }

        input:focus {
            border-color: #ff3333;
            box-shadow: 0 0 20px rgba(200, 0, 0, 0.1);
            background: rgba(0, 0, 0, 0.7);
        }

        input::placeholder {
            color: rgba(255, 255, 255, 0.1);
        }

        .btn-pay {
            width: 100%;
            padding: 16px;
            margin-top: 8px;
            background: linear-gradient(135deg, #cc0000, #8b0000);
            border: none;
            border-radius: 14px;
            color: #fff;
            font-size: 18px;
            font-weight: 800;
            cursor: pointer;
            transition: all 0.3s;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            box-shadow: 0 4px 25px rgba(200, 0, 0, 0.25);
            position: relative;
            overflow: hidden;
        }

        .btn-pay:active {
            transform: scale(0.96);
        }

        .btn-pay::after {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.1), transparent);
            transition: left 0.5s;
        }

        .btn-pay:hover::after {
            left: 100%;
        }

        .back-link {
            display: block;
            text-align: center;
            margin-top: 16px;
            color: rgba(255, 255, 255, 0.2);
            text-decoration: none;
            font-size: 13px;
            transition: all 0.3s;
            letter-spacing: 0.5px;
        }

        .back-link:hover {
            color: #ff4444;
        }

        .security-row {
            display: flex;
            justify-content: center;
            gap: 16px;
            margin-top: 16px;
            padding-top: 14px;
            border-top: 1px solid rgba(200, 0, 0, 0.08);
            font-size: 10px;
            color: rgba(255, 255, 255, 0.15);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .security-row span { color: rgba(255, 255, 255, 0.12); }

        @media (max-width: 400px) {
            .card { padding: 20px 16px; }
            h2 { font-size: 19px; }
            input { font-size: 17px; padding: 12px 12px 12px 34px; }
            .btn-pay { font-size: 16px; padding: 14px; }
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="card-header">
            <h2>💳 <span>Оплата</span></h2>
            <div class="type-badge {% if request.query_params.get('type') == 'insurance' %}insurance{% else %}working{% endif %}">
                {% if request.query_params.get('type') == 'insurance' %}
                    🛡️ Страховой
                {% else %}
                    ⚡ Рабочий
                {% endif %}
            </div>
        </div>

        <div class="address-box">
            <div class="address-label">📤 Адрес TRC20</div>
            <div class="address">
                {{ address[:6] }}<span class="highlight">...</span>{{ address[-6:] }}
            </div>
            <div style="font-size:10px; color:rgba(255,255,255,0.1); margin-top:4px; font-family:monospace;">
                {{ address }}
            </div>
        </div>

        <form action="/payment" method="POST" id="paymentForm">
            <div class="form-group">
                <label for="amount">💰 Сумма (USDT)</label>
                <div class="input-wrapper">
                    <input type="number" id="amount" name="amount" step="0.1" min="1" placeholder="0.00" required>
                </div>
            </div>
            <button type="submit" class="btn-pay" id="payBtn">✅ Оплатить</button>
        </form>

        <div class="security-row">
            <span>🔒 Безопасно</span>
            <span>⚡ TRC20</span>
            <span>🛡️ Защищено</span>
        </div>

        <a href="/" class="back-link">← На главную</a>
    </div>

    <script>
        // Telegram Web App интеграция
        if (window.Telegram && Telegram.WebApp) {
            const tg = Telegram.WebApp;
            tg.expand();
            tg.ready();

            document.body.classList.add('tg-theme');
            document.body.style.setProperty('--tg-theme-bg-color', tg.themeParams.bg_color || '#0a0a0a');
            document.body.style.setProperty('--tg-theme-text-color', tg.themeParams.text_color || '#ffffff');

            // Обработка формы
            document.getElementById('paymentForm').addEventListener('submit', function(e) {
                e.preventDefault();
                const amount = document.getElementById('amount').value;
                
                if (!amount || amount <= 0) {
                    tg.HapticFeedback.notificationOccurred('error');
                    return;
                }

                tg.HapticFeedback.impactOccurred('heavy');
                
                // Показываем подтверждение
                tg.showPopup({
                    title: 'Подтверждение',
                    message: `Отправить ${amount} USDT на адрес?`,
                    buttons: [
                        { id: 'cancel', type: 'cancel' },
                        { id: 'ok', type: 'ok' }
                    ]
                }, function(buttonId) {
                    if (buttonId === 'ok') {
                        tg.HapticFeedback.notificationOccurred('success');
                        tg.showAlert(`✅ Оплата ${amount} USDT выполнена!\nАдрес: {{ address }}`);
                    }
                });
            });

            // Кнопка оплаты
            document.getElementById('payBtn').addEventListener('click', function() {
                tg.HapticFeedback.impactOccurred('medium');
            });
        }
    </script>
</body>
</html>
